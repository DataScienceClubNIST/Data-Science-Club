name: Supabase 48-Hour Keep-Alive Cron

on:
  schedule:
    # Runs daily at 00:00 UTC (re-pings every 24h to guarantee Supabase never pauses)
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Website Keep-Alive API Endpoint
        run: |
          echo "Pinging Website Supabase Keep-Alive Route..."
          SITE_URL="${{ secrets.PUBLIC_SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://datascienceclub-nist.vercel.app"
          fi
          echo "Target URL: $SITE_URL/api/keep-alive"
          curl -sL -X GET "$SITE_URL/api/keep-alive" || echo "Website ping completed."

      - name: Direct Supabase REST API Ping (Backup)
        run: |
          SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          if [ -n "$SUPABASE_URL" ] && [ -n "$ANON_KEY" ]; then
            echo "Pinging Supabase REST API directly at $SUPABASE_URL ..."
            curl -sL -X GET "$SUPABASE_URL/rest/v1/events?select=id&limit=1" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" || echo "Supabase direct ping executed."
          else
            echo "Note: Add NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY to GitHub Secrets for direct backup pinging."
          fi
